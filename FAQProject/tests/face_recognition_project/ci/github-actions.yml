name: Face Recognition API CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.16
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/test_unit.py -v --tb=short

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short

      - name: Run UI tests
        run: |
          pytest tests/test_ui.py -v --tb=short

      - name: Run all tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t face-recognition-api:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name test-api -p 5000:5000 face-recognition-api:${{ github.sha }}
          sleep 5
          docker exec test-api curl -f http://localhost:5000/api/health || exit 1
          docker stop test-api

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          docker tag face-recognition-api:${{ github.sha }} $DOCKER_USERNAME/face-recognition-api:latest
          docker push $DOCKER_USERNAME/face-recognition-api:latest

      - name: Deploy to server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /app/face-recognition
            docker-compose pull
            docker-compose up -d
            docker exec face-recognition-api curl -f http://localhost:5000/api/health
