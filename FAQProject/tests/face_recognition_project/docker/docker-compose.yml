version: '3.8'

services:
  face-recognition-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: face-recognition-api
    ports:
      - "5000:5000"
    volumes:
      - ../uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  face-recognition-ui:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: face-recognition-ui
    ports:
      - "5001:80"
    volumes:
      - ../ui:/usr/share/nginx/html
    restart: unless-stopped
    depends_on:
      - face-recognition-api
