<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人脸识别 - 移动端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            max-width: 100%;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            color: white;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #canvasOutput {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            pointer-events: none;
        }

        .camera-overlay.hidden {
            display: none;
        }

        .camera-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .camera-text {
            font-size: 16px;
            text-align: center;
            padding: 0 20px;
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 14px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .results-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .results-panel.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .result-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .face-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .face-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .face-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .history-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .history-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .history-time {
            font-size: 12px;
            color: #999;
        }

        .history-count {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }

        .error-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }

        .error-toast.show {
            display: block;
        }

        .success-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #2ed573;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }

        .success-toast.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🔍 人脸识别系统</h1>
            <p>实时人脸检测与分析</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" id="cameraModeBtn" onclick="switchMode('camera')">
                📷 摄像头
            </button>
            <button class="mode-btn" id="uploadModeBtn" onclick="switchMode('upload')">
                📁 上传图片
            </button>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasOutput"></canvas>
            <div class="camera-overlay" id="cameraOverlay">
                <div class="camera-icon">📷</div>
                <div class="camera-text">点击"开启摄像头"按钮<br>开始实时人脸识别</div>
            </div>
        </div>

        <div class="control-panel" id="controlPanel">
            <div id="uploadSection" style="display: none;">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择图片或拍照</div>
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="startCameraBtn" onclick="startCamera()">
                    📷 开启摄像头
                </button>
                <button class="btn btn-danger" id="stopCameraBtn" onclick="stopCamera()" style="display: none;">
                    ⏹️ 停止检测
                </button>
                <button class="btn btn-secondary" id="captureBtn" onclick="captureImage()" style="display: none;">
                    📸 拍照识别
                </button>
                <button class="btn btn-secondary" id="historyBtn" onclick="showHistory()">
                    📜 历史记录
                </button>
            </div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="result-header">
                <span class="result-title">检测结果</span>
                <span class="face-count" id="faceCountBadge">0 人脸</span>
            </div>
            <div id="facesList"></div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <div class="history-panel" id="historyPanel" style="display: none;">
            <div class="history-title">📜 检测历史</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div>
            <div class="spinner"></div>
            <div class="loading-text">处理中...</div>
        </div>
    </div>

    <div class="error-toast" id="errorToast"></div>
    <div class="success-toast" id="successToast"></div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let video = document.getElementById('videoElement');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let stream = null;
        let isCameraActive = false;
        let currentMode = 'camera';
        let processing = false;

        async function switchMode(mode) {
            currentMode = mode;

            document.getElementById('cameraModeBtn').classList.toggle('active', mode === 'camera');
            document.getElementById('uploadModeBtn').classList.toggle('active', mode === 'upload');
            document.getElementById('uploadSection').style.display = mode === 'upload' ? 'block' : 'none';
            document.getElementById('startCameraBtn').style.display = mode === 'camera' ? 'flex' : 'none';

            if (mode === 'upload') {
                stopCamera();
            }
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: 640, height: 480 }
                });

                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('cameraOverlay').classList.add('hidden');
                document.getElementById('startCameraBtn').style.display = 'none';
                document.getElementById('stopCameraBtn').style.display = 'flex';
                document.getElementById('captureBtn').style.display = 'flex';

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                isCameraActive = true;
                detectFaces();

            } catch (err) {
                showError('无法访问摄像头: ' + err.message);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.style.display = 'none';
            video.srcObject = null;
            document.getElementById('cameraOverlay').classList.remove('hidden');
            document.getElementById('startCameraBtn').style.display = 'flex';
            document.getElementById('stopCameraBtn').style.display = 'none';
            document.getElementById('captureBtn').style.display = 'none';

            isCameraActive = false;
        }

        async function detectFaces() {
            if (!isCameraActive || processing) return;

            processing = true;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const imageData = canvas.toDataURL('image/jpeg', 0.8);

                const response = await fetch(`${API_BASE}/api/detect/base64`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();

                if (data.success) {
                    drawFaceBoxes(data.faces);
                    displayResults(data);
                }

            } catch (err) {
                console.error('Detection error:', err);
            }

            processing = false;

            if (isCameraActive) {
                requestAnimationFrame(detectFaces);
            }
        }

        function drawFaceBoxes(faces) {
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;

            faces.forEach(face => {
                ctx.strokeRect(face.x, face.y, face.width, face.height);

                let label = '';
                if (face.gender) label += face.gender;
                if (face.age) label += ' ' + face.age;

                if (label) {
                    ctx.fillStyle = '#667eea';
                    ctx.fillRect(face.x, face.y - 25, ctx.measureText(label).width + 10, 25);
                    ctx.fillStyle = 'white';
                    ctx.font = '14px sans-serif';
                    ctx.fillText(label, face.x + 5, face.y - 7);
                }
            });
        }

        async function captureImage() {
            if (!isCameraActive) return;

            showLoading(true);

            try {
                const imageData = canvas.toDataURL('image/jpeg', 0.9);

                const response = await fetch(`${API_BASE}/api/detect/base64`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                    showSuccess(`检测到 ${data.face_count} 个人脸`);
                }

            } catch (err) {
                showError('处理失败: ' + err.message);
            }

            showLoading(false);
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('detect_features', 'true');

                const response = await fetch(`${API_BASE}/api/detect/file`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                    showSuccess(`检测到 ${data.face_count} 个人脸`);

                    if (data.result_image) {
                        const img = new Image();
                        img.src = `${API_BASE}${data.result_image}`;
                        img.onload = () => {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    }
                }

            } catch (err) {
                showError('处理失败: ' + err.message);
            }

            showLoading(false);
        }

        function displayResults(data) {
            const panel = document.getElementById('resultsPanel');
            const facesList = document.getElementById('facesList');
            const statsGrid = document.getElementById('statsGrid');
            const badge = document.getElementById('faceCountBadge');

            panel.classList.add('show');
            badge.textContent = `${data.face_count} 人脸`;

            if (data.faces && data.faces.length > 0) {
                facesList.innerHTML = data.faces.map((face, index) => `
                    <div class="face-card">
                        <div class="face-info">
                            <div class="info-item">
                                <div class="info-label">性别</div>
                                <div class="info-value">${face.gender || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">年龄</div>
                                <div class="info-value">${face.age || '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">微笑</div>
                                <div class="info-value">${face.smiling ? '😊 是' : '😐 否'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">眼睛</div>
                                <div class="info-value">${face.eyes ? face.eyes.length : 0} 个</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                facesList.innerHTML = '<p style="text-align: center; color: #999;">未检测到人脸</p>';
            }

            statsGrid.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${data.face_count}</div>
                    <div class="stat-label">检测人数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${data.has_face ? '是' : '否'}</div>
                    <div class="stat-label">有人脸</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${data.faces ? data.faces.length : 0}</div>
                    <div class="stat-label">详细信息</div>
                </div>
            `;
        }

        async function showHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/history?limit=20`);
                const data = await response.json();

                const historyList = document.getElementById('historyList');
                const historyPanel = document.getElementById('historyPanel');

                if (data.records && data.records.length > 0) {
                    historyList.innerHTML = data.records.map(record => `
                        <div class="history-item">
                            <div>
                                <div class="history-count">${record.face_count} 人脸</div>
                                <div class="history-time">${new Date(record.timestamp).toLocaleString()}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyList.innerHTML = '<p style="text-align: center; color: #999;">暂无历史记录</p>';
                }

                historyPanel.style.display = 'block';
                document.getElementById('resultsPanel').classList.remove('show');

            } catch (err) {
                showError('获取历史失败: ' + err.message);
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function showError(message) {
            const toast = document.getElementById('errorToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showSuccess(message) {
            const toast = document.getElementById('successToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            canvas.width = 640;
            canvas.height = 480;
        });
    </script>
</body>
</html>
